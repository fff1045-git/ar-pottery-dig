<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a140f" />
    <title>AR 도자기 발굴</title>
  </head>
  <body>
    <div id="map" aria-label="지도"></div>

    <div class="top">
      <header class="topbar">
        <div class="chip" id="src-chip">위치 준비 중…</div>
        <button class="chip chip-btn" id="dex-btn" type="button" aria-label="도감 열기">
          🏺 <span id="dex-count">0</span>
        </button>
      </header>

      <form id="search" class="search" role="search" hidden>
        <input id="search-input" type="search" placeholder="장소·주소 검색 (예: 서울역)" enterkeyhint="search" autocomplete="off" aria-label="장소·주소 검색" />
        <button type="submit">검색</button>
      </form>
      <ul id="search-results" class="search-results" hidden></ul>

      <div id="banner" class="banner" role="status" hidden>
        <span id="banner-text"></span>
        <button id="banner-action" type="button" hidden></button>
        <button id="banner-close" type="button" aria-label="닫기">✕</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <footer class="bottombar">
      <p id="hint" class="hint" hidden></p>
      <section id="detector" class="detector" aria-label="탐지기">
        <div class="detector-bars" id="detector-bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <p class="detector-text" id="detector-text" role="status">탐지기 준비 중…</p>
        <button id="sound-btn" class="detector-sound" type="button" aria-pressed="true" aria-label="탐지기 소리">🔊</button>
        <button id="dig-btn" class="dig-btn" type="button" hidden>⛏️ 발굴하기</button>
      </section>
      <div class="actions">
        <button id="follow-btn" type="button" class="active">📍 내 위치</button>
        <button id="roadview-btn" type="button" hidden>🛣️ 로드뷰</button>
        <button id="mode-btn" type="button"></button>
      </div>
    </footer>

    <section id="dex" class="sheet" aria-label="도감" hidden>
      <div class="sheet-head">
        <h2>도감 <small id="dex-progress"></small></h2>
        <button id="dex-close" type="button" aria-label="닫기">✕</button>
      </div>
      <p class="dex-dust">고운 흙 <b id="dex-dust">0</b> · 중복 조각을 얻으면 쌓이고, 모자란 조각과 바꿀 수 있어요.</p>
      <ul id="dex-list" class="vessels"></ul>
      <button id="reset-btn" type="button" class="danger">진행도 초기화</button>
    </section>

    <section id="roadview" class="sheet roadview" aria-label="로드뷰" hidden>
      <div class="sheet-head">
        <h2>로드뷰</h2>
        <button id="roadview-close" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="roadview-view"></div>
    </section>

    <section id="dig" class="dig" aria-label="발굴 화면" hidden></section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
